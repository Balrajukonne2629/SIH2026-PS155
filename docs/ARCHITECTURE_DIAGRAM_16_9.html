<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NTRO PS26155 — Master System Architecture Diagram (16:9 Widescreen SVG)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #05070a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .wrapper {
      max-width: 1440px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 12px 20px;
      border-radius: 12px;
    }
    .title-group h2 {
      font-size: 16px;
      font-weight: 700;
      color: #f8fafc;
    }
    .title-group p {
      font-size: 12px;
      color: #94a3b8;
    }
    .btn-group {
      display: flex;
      gap: 10px;
    }
    .btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
    }
    .slide-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #080b11;
      border: 1px solid #1e293b;
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      display: flex;
    }
    .slide-container object {
      width: 100%;
      height: 100%;
      display: block;
    }
    @media print {
      body { background: white; padding: 0; }
      .toolbar { display: none; }
      .slide-container { border: none; box-shadow: none; width: 100vw; height: 100vh; }
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="toolbar">
      <div class="title-group">
        <h2>NTRO PS26155 · Master Architecture Diagram (PRD v7.0)</h2>
        <p>16:9 Widescreen · Vector SVG · 7-Layer Defense-Grade Pipeline</p>
      </div>
      <div class="btn-group">
        <button class="btn" onclick="downloadSVG()">📥 Download SVG (PowerPoint/Keynote)</button>
        <button class="btn" onclick="copySVG()">📋 Copy SVG Code</button>
        <button class="btn" onclick="window.print()">🖨️ Print / Save as PDF</button>
      </div>
    </div>

    <div class="slide-container" id="svgFrame">
      <object id="svgObject" data="ARCHITECTURE_DIAGRAM_16_9.svg" type="image/svg+xml"></object>
    </div>
  </div>

  <script>
    function downloadSVG() {
      const link = document.createElement('a');
      link.href = 'ARCHITECTURE_DIAGRAM_16_9.svg';
      link.download = 'NTRO_PS26155_PRD_v7_System_Architecture_16_9.svg';
      link.click();
    }

    async function copySVG() {
      try {
        const response = await fetch('ARCHITECTURE_DIAGRAM_16_9.svg');
        const text = await response.text();
        await navigator.clipboard.writeText(text);
        alert('SVG XML code copied to clipboard! You can paste it directly into PowerPoint, Figma, Canva, or Illustrator.');
      } catch (err) {
        alert('Unable to copy SVG automatically. Use the download button.');
      }
    }
  </script>
</body>
</html>
