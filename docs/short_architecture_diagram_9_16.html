<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NTRO PS26155 — 9:16 Vertical Architecture Diagram</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #05070a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px;
      min-height: 100vh;
    }
    .wrapper {
      max-width: 620px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 12px 18px;
      border-radius: 12px;
    }
    .title-group h2 {
      font-size: 15px;
      font-weight: 700;
      color: #f8fafc;
    }
    .title-group p {
      font-size: 11.5px;
      color: #94a3b8;
    }
    .btn-group {
      display: flex;
      gap: 8px;
    }
    .btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
    }
    .slide-container {
      width: 100%;
      aspect-ratio: 9 / 16;
      background: #080b11;
      border: 1px solid #1e293b;
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      display: flex;
    }
    .slide-container svg, .slide-container object {
      width: 100%;
      height: 100%;
      display: block;
    }
    @media print {
      body { background: white; padding: 0; }
      .toolbar { display: none; }
      .slide-container { border: none; box-shadow: none; width: 100vw; height: 100vh; }
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="toolbar">
      <div class="title-group">
        <h2>NTRO PS26155 · 9:16 Architecture Diagram</h2>
        <p>Vertical Ratio · 1080×1920 Vector SVG · Presentation & Mobile Ready</p>
      </div>
      <div class="btn-group">
        <button class="btn" onclick="downloadSVG()">📥 Download SVG</button>
        <button class="btn" onclick="copySVG()">📋 Copy SVG</button>
      </div>
    </div>

    <div class="slide-container">
      <object id="svgObject" data="short_architecture_diagram_9_16.svg" type="image/svg+xml" style="width: 100%; height: 100%;"></object>
    </div>
  </div>

  <script>
    function downloadSVG() {
      const link = document.createElement('a');
      link.href = 'short_architecture_diagram_9_16.svg';
      link.download = 'NTRO_PS26155_System_Architecture_9_16.svg';
      link.click();
    }

    async function copySVG() {
      try {
        const response = await fetch('short_architecture_diagram_9_16.svg');
        const text = await response.text();
        await navigator.clipboard.writeText(text);
        alert('9:16 SVG code copied to clipboard!');
      } catch (err) {
        alert('Please use the Download button to save the SVG.');
      }
    }
  </script>
</body>
</html>
